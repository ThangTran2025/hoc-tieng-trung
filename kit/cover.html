<!doctype html><html lang="vi"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#070d1f;font-family:"Inter","Noto Sans CJK SC","Noto Sans CJK HK",sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(900px 900px at 15% 12%,#1f4fd088,transparent),radial-gradient(1000px 1000px at 95% 75%,#6a3ee088,transparent),#070d1f}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:60px 60px}
.pill{position:absolute;left:70px;top:330px;padding:16px 34px;border-radius:60px;background:#3CE0FF22;border:2px solid #3CE0FF88;color:#3CE0FF;font-size:40px;font-weight:800;letter-spacing:.12em}
.t1{position:absolute;left:70px;top:430px;width:940px;font-size:112px;font-weight:900;line-height:1.12;letter-spacing:-.01em;text-shadow:0 8px 40px #0008}
.t1 b{color:#FFC857;font-weight:900}
.t2{position:absolute;left:70px;top:700px;width:940px;font-size:58px;font-weight:600;color:#c9d5ff;line-height:1.3}
.zh{position:absolute;left:0;width:1080px;top:900px;text-align:center;font-size:280px;font-weight:900;text-shadow:0 0 80px #3CE0FFaa;line-height:1.1}
.py{position:absolute;left:0;width:1080px;top:1240px;text-align:center;font-size:64px;font-weight:700;color:#3CE0FF;letter-spacing:.05em}
.tag{position:absolute;left:0;width:1080px;top:1370px;text-align:center}
.tag span{display:inline-block;margin:0 10px;padding:18px 38px;border-radius:60px;background:#ffffff16;border:2px solid #ffffff30;font-size:46px;font-weight:700}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="pill">TIN NÓNG HSK</div>
<div class="t1">HSK MỚI<br><b>từ 13/12/2026</b></div>
<div class="t2">5 thay đổi bạn cần biết</div>
<div class="zh">新HSK</div><div class="py">xīn HSK</div>
<div class="tag"><span>9 cấp độ</span><span>Thi nói</span><span>Từ vựng mới</span></div>
</body></html>
